apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: crud-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: web.minikube.local
      http:
        paths:
          - path: /todo-backend
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8080
